name: IcpKit Integration Tests

on:
  workflow_dispatch:
  schedule:
    # Mondays at 07:23 UTC; avoid the busy start of the hour.
    - cron: '23 7 * * 1'

permissions:
  contents: read

jobs:
  integration-tests:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app

      - name: Show environment
        run: |
          xcodebuild -version
          swift --version

      - name: Run live canister integration tests
        timeout-minutes: 20
        shell: bash
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace IcpKit.xcworkspace \
            -scheme IcpKit-Integration \
            -destination 'platform=macOS' \
            -enableCodeCoverage NO \
            -parallel-testing-enabled NO \
            -resultBundlePath IntegrationTests.xcresult \
            2>&1 | tee integration-tests.log

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            IntegrationTests.xcresult
            integration-tests.log
          retention-days: 14
          if-no-files-found: warn
